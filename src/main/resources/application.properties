server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://user-service:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**, /api/payment-cards/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://order-service:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**, /api/items/**

jwt.secret=${JWT_SECRET}