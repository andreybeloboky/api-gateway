services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - innowise_network
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - innowise_network

  payment-mongodb:
      image: mongo:7.0
      container_name: payment-mongodb
      restart: always
      environment:
        MONGO_INITDB_DATABASE: payment-db
      ports:
        - "27017:27017"
      volumes:
        - payment_mongodb_data:/data/db
      networks:
        - innowise_network
      healthcheck:
        test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
        interval: 10s
        timeout: 5s
        retries: 5


  postgres-user-db:
    image: postgres:17
    container_name: postgres-user-db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-root}
    ports:
      - "5432:5432"
    networks:
      - innowise_network
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d mydb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-user:
    image: redis
    container_name: redis-user
    hostname: redis-user
    ports:
      - "6379:6379"
    networks:
      - innowise_network
    volumes:
      - user_redis_data:/data

  redis-commander-user:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-user
    restart: always
    environment:
      - REDIS_HOSTS=local:redis-user:6379
    ports:
      - "8091:8081"
    networks:
      - innowise_network

  postgres-order-db:
    image: postgres:17
    container_name: postgres-order-db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-root}
    ports:
      - "5434:5432"
    networks:
      - innowise_network
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d mydb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-order:
    image: redis
    container_name: redis-order
    hostname: redis-order
    ports:
      - "6380:6379"
    networks:
      - innowise_network
    volumes:
      - order_redis_data:/data

  redis-commander-order:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-order
    restart: always
    environment:
      - REDIS_HOSTS=local:redis-order:6379
    ports:
      - "8092:8081"
    networks:
      - innowise_network

  postgres-auth-db:
    image: postgres:17
    container_name: postgres-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "5433:5432"
    networks:
      - innowise_network
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d auth_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8080"
    depends_on:
      postgres-user-db:
        condition: service_healthy
      redis-user:
        condition: service_started
    env_file:
      - ../user-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_USER_URL=${SPRING_DATASOURCE_USER_URL}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD:-root}
      - REDIS_HOST=redis-user
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - innowise_network

  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8084:8080"
    depends_on:
      postgres-order-db:
        condition: service_healthy
      redis-order:
        condition: service_started
    env_file:
      - ../order-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_ORDER_URL=${SPRING_DATASOURCE_ORDER_URL}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD:-root}
      - REDIS_HOST=redis-order
      - REDIS_PORT=${REDIS_PORT}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - innowise_network

  auth-service:
    build:
      context: ../authentication-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8082:8080"
    depends_on:
      postgres-auth-db:
        condition: service_healthy
    env_file:
      - ../authentication-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_AUTH_URL=${SPRING_DATASOURCE_AUTH_URL}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD:-root}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - innowise_network

  payment-service:
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8085:8080"
    depends_on:
      payment-mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ../payment-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://payment-mongodb:27017/payment-db
      - SPRING_DATA_MONGODB_DATABASE=payment-db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - EXTERNAL_RANDOM_API_URL=https://www.randomnumberapi.com/api/v1.0/random?min=1&max=100&count=1
    networks:
      - innowise_network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - order-service
      - auth-service
      - payment-service
    networks:
      - innowise_network
    environment:
      - JWT_SECRET=${JWT_SECRET}

volumes:
  user_db_data:
  user_redis_data:
  order_db_data:
  order_redis_data:
  auth_db_data:

networks:
  innowise_network:
    driver: bridge